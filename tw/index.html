<script>

(function(){
  /* 從簡/英切換過來時不顯示「載入中」字樣，避免閃一下 */
  try{if(sessionStorage.getItem('bld-pos')){var L=document.getElementById('bldLoading');if(L)L.style.visibility='hidden';}}catch(e){}
  var PAIRS='导導体體号號对對兰蘭电電设設备備换換华華创創厂廠与與盖蓋铝鋁硅矽锆鋯极極离離蚀蝕积積随隨们們吗嗎么麼关關独獨产產级級为為标標仅僅于於识識别別无無隶隸属屬权權书書证證图圖纸紙来來样樣开開发發达達烧燒结結适適务務询詢价價订訂网網盘盤团團队隊时時内內规規视視复複杂雜数數确確码碼转轉签簽后後进進带帶单單脚腳会會触觸浏瀏览覽这這里裡动動补補键鍵点點击擊统統计計邮郵话話户戶见見问問题題昼晝国國学學盐鹽宁寧联聯专專将將业業检檢测測湾灣硕碩资資术術员員构構喷噴涂塗从從终終质質闭閉环環稳穩实實项項种種温溫选選热熱刚剛载載类類绝絕缘緣静靜强強韧韌应應优優脱脫胀脹扩擴艺藝协協乡鄉洁潔净淨条條链鏈炉爐机機余餘担擔尘塵车車间間满滿圆圓仪儀语語抛拋径徑现現头頭阵陣报報胶膠显顯划劃输輸称稱个個词詞没沒给給师師并並线線验驗过過纯純亚亞长長装裝试試蓝藍宝寶论論准準还還诉訴总總东東栋棟请請择擇传傳较較压壓缩縮销銷负負责責严嚴紧緊张張顶頂写寫简簡门門访訪记記';
  var M={};for(var i=0;i<PAIRS.length;i+=2){M[PAIRS[i]]=PAIRS[i+1];}
  /* 台灣常用說法（在字形轉換之後替換） */
  var PHRASES=[
    ['刻蝕','蝕刻'],['等離子','電漿'],['離子注入','離子佈植'],['詢盤','詢價'],
    ['信息','資訊'],['質量','品質'],['郵箱','電子信箱'],['關系','關係'],['聯系','聯繫'],
    ['回複','回覆'],['芯片','晶片'],['支持','支援'],['在線','線上'],['項目','專案'],
    ['制造','製造'],['定制','訂製'],['制作','製作'],['研制','研製'],
    ['起訂量','最小訂購量'],['件號','料號'],['零部件','零組件'],
    ['制程','製程'],['制品','製品'],['用戶','客戶'],['依托','依託'],['文件','檔案'],
    ['兼容','相容'],['光掩模','光罩'],['器件','元件'],['每一只','每一個'],['實用新型','新型'],
    ['三坐標測量機','三次元量測儀'],['三坐標精密測量','三次元精密量測'],['三坐標','三次元'],
    ['外延','磊晶'],['靜電卡盤','靜電夾盤'],['行業','產業'],['發郵件至','來信至']
  ];
  function conv(s){
    s=s.replace(/[一-鿿]/g,function(c){return M[c]||c;});
    for(var j=0;j<PHRASES.length;j++){s=s.split(PHRASES[j][0]).join(PHRASES[j][1]);}
    return s;
  }
  function show(html){
    html=conv(html);
    html=html.split('zh-CN').join('zh-TW');
    html=html.replace('<head>','<head><script>window.BLD_PAGE="tw";<\/script>');
    html=html.replace('<link rel="canonical" href="https://bilateral.top/">','<link rel="canonical" href="https://bilateral.top/tw/">');
    html=html.split('property="og:url" content="https://bilateral.top/"').join('property="og:url" content="https://bilateral.top/tw/"');
    html=html.split('og:locale" content="zh_CN"').join('og:locale" content="zh_TW"');
    html=html.split('https://bilateral.top/?sent=1#contact').join('https://bilateral.top/tw/?sent=1#contact');
    html=html.replace('<button type="button" data-l="zh" class="on">簡</button><button type="button" data-href="/tw/" data-save="tw">繁</button><button type="button" data-l="en">EN</button>',
      '<button type="button" data-href="/" data-save="zh">簡</button><button type="button" data-l="zh" class="on">繁</button><button type="button" data-href="/en/" data-save="en">EN</button>');
    var hash=location.hash;
    document.open();document.write(html);document.close();
    /* 站內連結（#contact 等）在內容寫入後再捲動到對應區塊 */
    if(hash&&hash.length>1){
      var tid=hash.slice(1);
      if(tid==='contact'&&window.innerWidth<=900)return; /* 手機端由頁面自身定位到表單 */
      var go=function(){var el=document.getElementById(tid);if(el)el.scrollIntoView({behavior:'instant',block:'start'});};
      setTimeout(go,300);setTimeout(go,1200);
    }
  }
  var tries=0;
  function load(){
    fetch('/?src=tw',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(show).catch(function(){
      if(++tries<3){setTimeout(load,800);}else{location.replace('/');}
    });
  }
  load();
})();
</script>
